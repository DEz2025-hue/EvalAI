name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Typecheck web
        run: pnpm --filter web typecheck
      
      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck
      
      - name: Typecheck shared
        run: pnpm --filter @eval-ai/shared typecheck
      
      - name: Typecheck ai-adapter
        run: pnpm --filter @eval-ai/ai-adapter typecheck
      
      - name: Typecheck supabase
        run: pnpm --filter @eval-ai/supabase typecheck
      
      - name: Build web
        run: pnpm --filter web build
      
      - name: Lint web
        run: pnpm --filter web lint
      
      - name: Test shared
        run: pnpm --filter @eval-ai/shared test

      - name: Test web and ai-adapter (if present)
        run: pnpm -r --if-present test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser end-to-end tests (demo mode, production build)
        env:
          E2E_SERVER_COMMAND: node node_modules/next/dist/bin/next start -p 3100
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  rls:
    # Applies every migration to a throw-away local Supabase stack, then runs supabase/tests/rls.test.sql against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase init --force
      - run: supabase start
      - name: Row-level security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PGOPTIONS: -c rls_test.strict=on
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.test.sql
